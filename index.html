<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>bbgpio apt repository</title>
<style>body{font-family:monospace;max-width:700px;margin:40px auto;padding:0 20px;}
pre{background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:6px;overflow-x:auto;}</style>
</head>
<body>
<h1>bbgpio apt repository</h1>
<p>GPIO control utility for BeagleBone Black</p>
<h2>Installation</h2>
<pre>
curl -fsSL https://perrier8wu.github.io/bbgpio/KEY.gpg | apt-key add -
echo "deb https://perrier8wu.github.io/bbgpio ./" | tee /etc/apt/sources.list.d/bbgpio.list
apt-get update && apt-get install bbgpio
</pre>
</body>
</html>
